# Example nginx site for the API: HTTPS in front, the Go server on 127.0.0.1:5000.
# Copy to /etc/nginx/sites-available/online-shopping, replace api.example.com,
# link it into sites-enabled, get a certificate (e.g. `sudo certbot --nginx -d api.example.com`)
# and reload nginx. In the app's .env set HOST=127.0.0.1 and TRUST_PROXY=true.

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API's per-IP rate limit reads this header when TRUST_PROXY=true.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
