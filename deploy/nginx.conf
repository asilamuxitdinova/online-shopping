# nginx site for the shop: the React build as static files and the Go API under
# /api/, both on one HTTPS domain (so the browser never needs CORS).
#
# 1. Build the frontend:      cd frontend && make build
# 2. Copy this file to /etc/nginx/sites-available/online-shopping, replace
#    shop.example.com and /opt/online-shopping, and link it into sites-enabled.
# 3. Get a certificate:       sudo certbot --nginx -d shop.example.com
# 4. In backend/.env set HOST=127.0.0.1 and TRUST_PROXY=true, then reload nginx.

server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shop.example.com;

    ssl_certificate     /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API's per-IP rate limit reads this header when TRUST_PROXY=true.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    root /opt/online-shopping/frontend/dist;

    # Built assets have content hashes in their names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Every other path is a page of the single-page app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
